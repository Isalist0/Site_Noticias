name: CI/CD Pipeline - Build, Test e Deploy

on:
  push:
    branches: [ "main" ] # ou "master"
  pull_request:
    branches: [ "main" ]

# Permissões necessárias para o GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. ETAPA DE BUILD
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar estrutura de arquivos (Build Check)
        run: |
          echo "Verificando se os arquivos principais existem..."
          ls -la
          test -f index.html
          test -f style.css
          echo "Build preliminar concluído com sucesso!"

  # 2. ETAPA DE TESTES
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar testes de validação de HTML
        uses: w3c/html-validator-action@v5
        with:
          path: 'index.html'

  # 3. ETAPA DE DEPLOY
  deploy:
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Enviar artefato (Upload artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Pasta raiz onde está o index.html

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
