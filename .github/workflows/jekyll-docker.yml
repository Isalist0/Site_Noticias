name: CI CD Pipeline - Build, Test e Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Verificando estrutura de arquivos..."
          test -f index.html
          test -f style.css
          echo "Arquivos verificados com sucesso!"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar HTML via W3C API
        run: |
          echo "Enviando index.html para validação no W3C..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --data-binary @index.html -H "Content-Type: text/html; charset=utf-8" "https://validator.nu/?out=gnu")
          echo "Código de resposta HTTP: $response"
          if [ "$response" -eq 200 ]; then
            echo "HTML processado com sucesso!"
          else
            echo "Aviso: O validador retornou o código $response."
          fi

  deploy:
    needs: [build, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
