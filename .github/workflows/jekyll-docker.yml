name: CI/CD Pipeline - Build, Test e Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. ETAPA DE BUILD (Verifica a existência dos arquivos essenciais)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Checar estrutura de arquivos
        run: |
          echo "Verificando arquivos da aplicação..."
          test -f index.html[cite: 2]
          test -f style.css[cite: 5]
          echo "Arquivos verificados com sucesso!"

  # 2. ETAPA DE DEPLOY (Executada APENAS em Pushes na branch principal)
  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Pasta onde estão os arquivos index.html e style.css[cite: 2, 5]

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
